<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Premium Splash Screen</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Animation -->
    <div class="background">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Splash Screen -->
    <section id="splash">

        <div class="glass-card">

            <!-- Logo -->
            <div class="logo-box">

                <div class="outer-ring"></div>

                <div class="middle-ring"></div>

                <div class="inner-ring">

                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSACvKL5J-nrWlyn8NAsfIEV0ZwTkC5FBvJeA_d9t1odA-GQ59hxhQSekzw&s=10" alt="Logo">

                </div>

            </div>

            <!-- School Name -->
            <h1>

              BALRAMPUR MODERN SCHOOL 

            </h1>

            <!-- Address -->
            <p class="address">

                BALRAMPUR, M.L.K PG COLLAGE

            </p>

            <!-- Tagline -->
            <p class="tagline">

                Wellcome in my school
            </p>

            <!-- Progress -->
            <div class="progress-area">

                <div class="progress-bar">

                    <div class="progress-fill"></div>

                </div>

                <div class="progress-info">

                    <span id="loadingText">

                        loading....

                    </span>

                    <span id="percentage">

                        0%

                    </span>

                </div>

            </div>

        </div>

        <!-- Bottom Text -->

        <div class="bottom-text">

            @ Copyright, Do'nt try
          
        </div>

    </section>

    <!-- JS -->
    <script src="script.js"></script>

</body>

</html>
